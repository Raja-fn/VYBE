name: vybe
description: "VYBE: verified, public-place companionship and meetups."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  connectivity_plus: ^7.3.2
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.1
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  intl: ^0.20.2
  json_annotation: '>=4.9.0 <4.10.0'
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  riverpod_annotation: ^3.0.3
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
  video_player: ^2.11.1

dev_dependencies:
  build_runner: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - config/app_config_defaults.json

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon: `python tool/icon/make_icon.py`, then `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0E0E12"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

# Start-up screen: `dart run flutter_native_splash:create`.
# The wordmark matches the first frame of the animated splash (lib/core/splash/).
flutter_native_splash:
  color: "#0E0E12"
  image: assets/icon/splash.png
  android_12:
    color: "#0E0E12"
    image: assets/icon/splash.png
    icon_background_color: "#0E0E12"
  fullscreen: false
